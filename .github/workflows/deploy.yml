name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; текущий не прерываем, чтобы не сломать публикацию
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Self-tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # URL Cloudflare-прокси (Settings → Secrets and variables → Actions → Variables → PROXY_URL).
          # Если не задан — приложение работает в демо-режиме или с ключом, введённым в настройках.
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
